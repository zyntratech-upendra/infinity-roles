<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favInfinity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0F172A" />
  
  <!-- Subtle inner gradient glow -->
  <circle cx="32" cy="32" r="26" fill="url(#favInfinity)" opacity="0.15" />
  
  <!-- Infinity Loop -->
  <path 
    d="M 32 32 C 26 23, 14 23, 11 32 C 8 41, 20 41, 32 32 C 44 23, 56 23, 53 32 C 50 41, 38 41, 32 32 Z" 
    stroke="url(#favInfinity)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />
  
  <!-- Accent Nodes for Roles -->
  <circle cx="14" cy="32" r="2.5" fill="#38BDF8" />
  <circle cx="50" cy="32" r="2.5" fill="#A855F7" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
</svg>