<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="irGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="irGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(4, 6)">
    <!-- Rounded Squircle Badge -->
    <rect width="60" height="60" rx="16" fill="#0F172A" />
    <rect width="60" height="60" rx="16" fill="none" stroke="url(#irGrad)" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Ambient Inner Glow -->
    <circle cx="30" cy="30" r="22" fill="url(#irGrad)" opacity="0.18" />
    
    <!-- Infinity Ribbon -->
    <path 
      d="M 30 30 C 24 20, 12 20, 9 30 C 6 40, 18 40, 30 30 C 42 20, 54 20, 51 30 C 48 40, 36 40, 30 30 Z" 
      stroke="url(#irGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#irGlow)"
    />
    
    <!-- Role Nexus Points -->
    <circle cx="12" cy="30" r="2.2" fill="#38BDF8" />
    <circle cx="48" cy="30" r="2.2" fill="#C084FC" />
    <circle cx="30" cy="30" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(76, 22)">
    <!-- Primary Name -->
    <text x="0" y="20" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      Infinity<tspan fill="url(#textGrad)">Roles</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#64748B" text-transform="uppercase">
      Workforce Intelligence
    </text>
  </g>
</svg>
